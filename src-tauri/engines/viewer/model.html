<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model preview</title>
<!-- Tinysolver Studio material preview: one GLB, orbit to look around.
     Served by the preview server at __codeg/viewer/model.html?src=<url>.
     Editor-only — builds do not carry it. -->
<style>
  html, body { margin: 0; height: 100%; background: #20232a; color: #c9ced8;
    font: 12px system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #info { position: fixed; left: 10px; bottom: 8px; opacity: .8; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 20px;
    text-align: center; color: #f3a6a6; }
</style>
<script type="importmap">
  { "imports": { "three": "../vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="info"></div>
<div id="err"></div>
<script type="module">
import * as THREE from "three"
import { GLTFLoader } from "../vendor/addons/loaders/GLTFLoader.js"
import { OrbitControls } from "../vendor/addons/controls/OrbitControls.js"

const src = new URLSearchParams(location.search).get("src")
const info = document.getElementById("info")
const err = document.getElementById("err")
const fail = (m) => { err.textContent = m; err.style.display = "grid"; console.error(m) }

const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.outputColorSpace = THREE.SRGBColorSpace
renderer.toneMapping = THREE.ACESFilmicToneMapping
document.body.prepend(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color(0x20232a)
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 2.2))
const key = new THREE.DirectionalLight(0xffffff, 2.4)
key.position.set(3, 5, 4)
scene.add(key)
const rim = new THREE.DirectionalLight(0xbfd4ff, 1.2)
rim.position.set(-4, 2, -3)
scene.add(rim)
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 1000)
const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.autoRotate = true
controls.autoRotateSpeed = 1.2
renderer.domElement.addEventListener("pointerdown", () => (controls.autoRotate = false))

function resize() {
  const w = innerWidth, h = innerHeight
  renderer.setSize(w, h, false)
  camera.aspect = w / h
  camera.updateProjectionMatrix()
}
addEventListener("resize", resize)
resize()

if (!src) fail("No model (?src=)")
else new GLTFLoader().load(src, (gltf) => {
  const root = gltf.scene
  scene.add(root)
  const box = new THREE.Box3().setFromObject(root)
  const size = box.getSize(new THREE.Vector3())
  const center = box.getCenter(new THREE.Vector3())
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1
  const dist = radius / Math.sin((camera.fov * Math.PI) / 360) * 1.15
  camera.position.copy(center).add(new THREE.Vector3(0.6, 0.35, 1).normalize().multiplyScalar(dist))
  camera.near = dist / 100
  camera.far = dist * 100
  camera.updateProjectionMatrix()
  controls.target.copy(center)
  let tris = 0
  root.traverse((o) => {
    if (o.isMesh) {
      const g = o.geometry
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3
    }
  })
  info.textContent = `${Math.round(tris).toLocaleString()} tris · ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}`
}, undefined, (e) => fail(`Could not load ${src}: ${e?.message ?? e}`))

renderer.setAnimationLoop(() => {
  controls.update()
  renderer.render(scene, camera)
})
</script>
</body>
</html>
