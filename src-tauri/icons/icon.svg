<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Tinysolver Studio — deliberately NOT upstream codeg's dark-navy `< ••• >` mark.
    This build is meant to sit next to codeg in the Dock / taskbar, so the two
    have to be told apart at 32px: warm amber field vs dark navy field, mesh
    triangle vs angle brackets. Change the hue and the glyph together if this
    is ever redrawn — either one alone stops being a one-glance difference.

    Full-bleed on purpose: the web favicon, the Windows .ico and the Linux PNGs
    all want the canvas filled. macOS is the exception — it needs an 824/1024
    safe-area inset — and that inset is applied when building icon.icns:

        python3 src-tauri/icons/macos-icon.gen.py

    Re-run it after changing anything below, or the Dock icon keeps the old art.
  -->
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb647"/>
      <stop offset="55%" style="stop-color:#fb8c24"/>
      <stop offset="100%" style="stop-color:#ef5c1a"/>
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#field)"/>

  <!-- 视口取景框角标 -->
  <g fill="none" stroke="#3b1703" stroke-width="20" stroke-linecap="round"
     stroke-linejoin="round" opacity="0.45">
    <polyline points="96,150 96,96 150,96"/>
    <polyline points="362,96 416,96 416,150"/>
    <polyline points="416,362 416,416 362,416"/>
    <polyline points="150,416 96,416 96,362"/>
  </g>

  <!-- 网格三角面（编辑中的多边形） -->
  <polygon points="256,158 364,344 148,344"
    fill="#fff4e2" fill-opacity="0.18"
    stroke="#fffaf2" stroke-width="26" stroke-linejoin="round"/>

  <!-- 三个顶点控制柄 -->
  <g fill="#3b1703" stroke="#fffaf2" stroke-width="14">
    <circle cx="256" cy="158" r="27"/>
    <circle cx="364" cy="344" r="27"/>
    <circle cx="148" cy="344" r="27"/>
  </g>
</svg>
